<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Layanan sedang tidak tersedia &middot; 503</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <style>
        :root {
            --primary: #4b3f9e;
            --primary-dark: #342586;
            --ease: cubic-bezier(0.43, 0.13, 0.23, 0.96);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
            background: #ffffff;
            color: #111827;
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .stage {
            width: 100%;
            max-width: 36rem;
            text-align: center;
            animation: rise 0.7s var(--ease) both;
        }

        .code {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            user-select: none;
        }

        .code__digit {
            font-size: clamp(4rem, 18vw, 7.5rem);
            font-weight: 800;
            line-height: 1;
            color: var(--primary);
        }

        .code__digit:nth-child(1) {
            animation: slide-left 0.8s var(--ease) both;
        }

        .code__digit:nth-child(3) {
            animation: slide-right 0.8s var(--ease) both;
        }

        .code__ghost {
            width: clamp(4.5rem, 16vw, 7.5rem);
            height: clamp(4.5rem, 16vw, 7.5rem);
            border-radius: 9999px;
            background: rgba(75, 63, 158, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            animation: fade-in 0.6s var(--ease) 0.2s both, float 2s ease-in-out 0.8s infinite alternate;
            transition: transform 0.6s var(--ease);
        }

        .code__ghost:hover {
            transform: translateY(-10px) scale(1.1);
        }

        .code__ghost svg {
            width: 58%;
            height: 58%;
            color: var(--primary);
        }

        .status {
            margin: 0 0 0.5rem;
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(75, 63, 158, 0.7);
        }

        h1 {
            margin: 0 0 1rem;
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 700;
            line-height: 1.25;
        }

        p.description {
            margin: 0 0 0.75rem;
            font-size: clamp(0.95rem, 2.2vw, 1.125rem);
            line-height: 1.65;
            color: #6b7280;
        }

        p.hint {
            margin: 0 0 2.25rem;
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            height: 48px;
            padding: 0 1.75rem;
            border-radius: 9999px;
            border: 1px solid transparent;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.25s var(--ease), background-color 0.2s;
        }

        .btn:hover {
            transform: scale(1.04);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn--primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 10px 25px -8px rgba(75, 63, 158, 0.55);
        }

        .btn--primary:hover {
            background: var(--primary-dark);
        }

        .btn--ghost {
            background: #fff;
            color: #374151;
            border-color: #e5e7eb;
        }

        .btn--ghost:hover {
            background: #f9fafb;
        }

        .btn svg {
            width: 1rem;
            height: 1rem;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slide-left {
            from {
                opacity: 0;
                transform: translate(-40px, 15px) rotate(-5deg);
            }

            to {
                opacity: 0.85;
                transform: none;
            }
        }

        @keyframes slide-right {
            from {
                opacity: 0;
                transform: translate(40px, 15px) rotate(5deg);
            }

            to {
                opacity: 0.85;
                transform: none;
            }
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes float {
            from {
                transform: translateY(-6px);
            }

            to {
                transform: translateY(6px);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="stage" data-static-error="503">
        <div class="code" aria-hidden="true">
            <span class="code__digit">5</span>
            <span class="code__ghost">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 10h.01" />
                    <path d="M15 10h.01" />
                    <path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z" />
                </svg>
            </span>
            <span class="code__digit">3</span>
        </div>

        <p class="status">Error 503 &middot; Service Unavailable</p>
        <h1>Layanan sedang tidak tersedia</h1>
        <p class="description">Server sedang sibuk, dalam pemeliharaan, atau sementara tidak bisa dihubungi.</p>
        <p class="hint">Coba beberapa menit lagi. Data Anda tidak hilang.</p>

        <div class="actions">
            <a class="btn btn--primary" href="/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                Kembali ke Beranda
            </a>
            <button class="btn btn--ghost" type="button" onclick="location.reload()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                    <path d="M21 3v5h-5" />
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                    <path d="M8 16H3v5" />
                </svg>
                Muat Ulang
            </button>
        </div>
    </main>
</body>

</html>
