services:

  nginx:
    image: nginx:alpine
    container_name: aplikasiweb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - aplikasiweb

  redis:
    image: redis:alpine
    container_name: aplikasiweb-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - aplikasiweb

  backend:
    build:
      context: ./backend
    container_name: aplikasiweb-backend
    restart: unless-stopped
    networks:
      - aplikasiweb

  frontend:
    build:
      context: ./frontend
    container_name: aplikasiweb-frontend
    restart: unless-stopped
    networks:
      - aplikasiweb

networks:
  aplikasiweb:

volumes:
  redis_data: