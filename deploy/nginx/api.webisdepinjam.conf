# ---------------------------------------------------------------------------
# Backend API — api.webisdepinjam.cloud
#
# Seluruh request diteruskan ke container backend (127.0.0.1:8081) yang
# menjalankan php-fpm + nginx internal.
#
# Mendukung GET/POST/PUT/PATCH/DELETE/OPTIONS, multipart/form-data (upload
# foto profil & berkas peminjaman), Authorization: Bearer Token (Sanctum),
# serta meneruskan X-Forwarded-For / X-Forwarded-Proto agar Laravel
# mengenali HTTPS dari reverse proxy.
#
# PASANG:
#   sudo cp deploy/nginx/upstreams.conf \
#       /etc/nginx/conf.d/webisdepinjam-upstreams.conf
#   sudo cp deploy/nginx/api.webisdepinjam.conf \
#       /etc/nginx/sites-available/api.webisdepinjam.conf
#   sudo ln -sfn /etc/nginx/sites-available/api.webisdepinjam.conf \
#       /etc/nginx/sites-enabled/api.webisdepinjam.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 80 → HTTPS (ACME challenge tetap dilayani webroot Certbot)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.webisdepinjam.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 443 — HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.webisdepinjam.cloud;

    ssl_certificate     /etc/letsencrypt/live/api.webisdepinjam.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.webisdepinjam.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Foto profil maks 5 MB, berkas peminjaman maks 10 MB.
    # 50 MB memberi ruang multipart boundary & header.
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/api.webisdepinjam.access.log;
    error_log  /var/log/nginx/api.webisdepinjam.error.log;

    # -----------------------------------------------------------------------
    # Semua route termasuk OPTIONS preflight (CORS ditangani Laravel).
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://webisdepinjam_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection          "";
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Port    $server_port;
        proxy_set_header Authorization       $http_authorization;

        # Multipart upload diteruskan langsung ke PHP (tanpa buffering host).
        client_body_buffer_size 256k;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Error JSON/Blade Laravel tidak ditimpa halaman nginx.
        proxy_intercept_errors off;
    }

    # Health check untuk monitoring.
    location = /up {
        proxy_pass http://webisdepinjam_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Jangan layani file tersembunyi (kecuali ACME di server port 80).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
