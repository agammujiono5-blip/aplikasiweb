# ---------------------------------------------------------------------------
# Frontend SPA — app.webisdepinjam.cloud
#
# Nginx host melakukan SSL termination lalu mem-proxy ke container frontend
# (127.0.0.1:8080) dan container backend (127.0.0.1:8081, untuk /api).
# Frontend memanggil API same-origin (`/api`) — tanpa CORS dan tanpa URL
# absolut di bundle (lihat DEPLOYMENT.md, strategi API same-origin).
#
# PASANG:
#   sudo cp deploy/nginx/upstreams.conf \
#       /etc/nginx/conf.d/webisdepinjam-upstreams.conf
#   sudo cp deploy/nginx/app.webisdepinjam.conf \
#       /etc/nginx/sites-available/app.webisdepinjam.conf
#   sudo ln -sfn /etc/nginx/sites-available/app.webisdepinjam.conf \
#       /etc/nginx/sites-enabled/app.webisdepinjam.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 80 → HTTPS (ACME challenge tetap dilayani webroot Certbot)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.webisdepinjam.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 443 — HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.webisdepinjam.cloud;

    ssl_certificate     /etc/letsencrypt/live/app.webisdepinjam.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.webisdepinjam.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Selaras dengan batas upload backend (50 MB).
    client_max_body_size 50m;

    # Security header.
    # CSP sengaja belum dipasang: React memakai inline style (Tailwind) dan
    # SVG inline. Tambahkan hanya setelah diuji di browser.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/app.webisdepinjam.access.log;
    error_log  /var/log/nginx/app.webisdepinjam.error.log;

    # -----------------------------------------------------------------------
    # API same-origin → backend Laravel.
    # Authorization: Bearer (Sanctum token) diteruskan apa adanya.
    # -----------------------------------------------------------------------
    location /api {
        proxy_pass http://webisdepinjam_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection          "";
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Port    $server_port;
        proxy_set_header Authorization       $http_authorization;

        # Multipart upload tanpa buffering penuh di host.
        client_body_buffer_size 256k;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Status non-2xx (401/413/422/429) diteruskan sebagai JSON Laravel.
        proxy_intercept_errors off;
    }

    # Health check backend (monitoring).
    location = /up {
        proxy_pass http://webisdepinjam_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Halaman error (Blade + fallback statis), dilayani backend.
    # -----------------------------------------------------------------------
    location /errors/ {
        proxy_pass http://webisdepinjam_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 500 502 503 504 = @static_503;
    }

    # -----------------------------------------------------------------------
    # SPA + aset statis. Container frontend sudah mengirim Cache-Control
    # yang tepat (assets immutable 1 tahun, index.html no-cache).
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://webisdepinjam_frontend;

        proxy_http_version 1.1;
        proxy_set_header Connection          "";
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Frontend container mati → halaman 503.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @static_503;
    }

    # Cadangan: halaman 503 statis dari container backend.
    # Named location tidak boleh memuat URI pada proxy_pass → pakai rewrite.
    location @static_503 {
        internal;
        rewrite ^ /errors/503.html break;
        proxy_pass http://webisdepinjam_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }
}
