# ---------------------------------------------------------------------------
# Upstream Docker untuk SiPinjam Kampus
#
# Blok `upstream` dan `map` wajib berada di dalam blok `http {}`. Pasang
# file ini di:
#
#   /etc/nginx/conf.d/webisdepinjam-upstreams.conf
#
# (BUKAN sites-enabled/: di Ubuntu, sites-enabled/*.conf di-include DI DALAM
# blok http {}, sehingga isinya harus berupa `server {}`.)
#
# Dipakai oleh:
#   app.webisdepinjam.conf → webisdepinjam_frontend, webisdepinjam_backend
#   api.webisdepinjam.conf → webisdepinjam_backend
#   webisdepinjam.conf     → hanya redirect (tanpa upstream)
#
# Port di bawah harus sama dengan FRONTEND_PORT / BACKEND_PORT di .env root
# (default 8080 / 8081). Docker hanya mempublikasikannya ke 127.0.0.1.
# ---------------------------------------------------------------------------

upstream webisdepinjam_frontend {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream webisdepinjam_backend {
    server 127.0.0.1:8081;
    keepalive 16;
}

# Map header WebSocket (disiapkan untuk kebutuhan realtime di masa depan).
map $http_upgrade $webisdepinjam_connection_upgrade {
    default upgrade;
    ''      close;
}
