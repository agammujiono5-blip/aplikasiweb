# ---------------------------------------------------------------------------
# Landing page — webisdepinjam.cloud (+ www → redirect permanen)
#
# Project belum punya landing page terpisah: routes/web.php hanya
# menampilkan resources/views/awal.blade.php (halaman status default).
# Karena itu domain utama diarahkan (301) ke aplikasi
# https://app.webisdepinjam.cloud sesuai struktur project.
# Jika kelak ada landing page nyata, ganti `return 301` pada location /
# di server 443 dengan proxy_pass ke container yang sesuai.
#
# PASANG:
#   sudo cp deploy/nginx/webisdepinjam.conf \
#       /etc/nginx/sites-available/webisdepinjam.conf
#   sudo ln -sfn /etc/nginx/sites-available/webisdepinjam.conf \
#       /etc/nginx/sites-enabled/webisdepinjam.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# www → apex (permanen)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.webisdepinjam.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://webisdepinjam.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.webisdepinjam.cloud;

    ssl_certificate     /etc/letsencrypt/live/www.webisdepinjam.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.webisdepinjam.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://webisdepinjam.cloud$request_uri;
}

# ---------------------------------------------------------------------------
# Apex — HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name webisdepinjam.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Apex — HTTPS → aplikasi
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webisdepinjam.cloud;

    ssl_certificate     /etc/letsencrypt/live/webisdepinjam.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webisdepinjam.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/webisdepinjam.access.log;
    error_log  /var/log/nginx/webisdepinjam.error.log;

    # Path apa pun (/login, /reset-password, ...) ikut dibawa ke aplikasi
    # supaya tautan lama tetap bekerja.
    location / {
        return 301 https://app.webisdepinjam.cloud$request_uri;
    }
}
