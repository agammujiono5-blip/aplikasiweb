# Parameter proxy bersama untuk container nginx internal.
# Di-include oleh setiap location yang mem-proxy ke backend/frontend.

proxy_http_version 1.1;

# Multipart upload tidak boleh di-buffer penuh dan dikenal backend.
proxy_request_buffering off;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Ambil nilai dari Nginx host bila ada. Jangan pakai $scheme karena di
# container selalu http dan akan menurunkan X-Forwarded-Proto=https menjadi
# http (menyebabkan URL aset jadi http:// dan cookie secure bermasalah).
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

# Authorization: Bearer (Sanctum token) tetap diteruskan.
proxy_set_header Authorization     $http_authorization;

# WebSocket (tidak dipakai saat ini, aman untuk upgrade header).
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;
