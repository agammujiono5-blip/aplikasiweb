# ---------------------------------------------------------------------------
# Nginx internal (container) — BUKAN SSL, BUKAN publik.
#
# Nginx host Ubuntu melakukan SSL termination dan meneruskan request ke
# container `frontend` (127.0.0.1:8080). Container `nginx` menyediakan
# seluruh origin di satu tempat (berguna untuk pratinjau / debug lokal dan
# sebagai referensi routing):
#
#   /api/*     → backend Laravel (php-fpm)
#   /up        → health check backend
#   /errors/*  → halaman error Blade
#   /          → frontend React (fallback SPA)
#   backend mati → 503.html statis (tidak menyentuh backend)
#
# Rate limiting login sudah ditangani Laravel (LoginRateLimiter +
# throttle:20,1), sehingga tidak diduplikasi di sini.
# ---------------------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;

    # Selaras php.ini & Laravel config/security.php (50 MB).
    client_max_body_size 50m;

    # ---------------------------------------------------------------------
    # API Laravel. Status non-2xx (401/422/429/413) diteruskan apa adanya
    # karena format JSON ditangani Laravel (bootstrap/app.php).
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy_params.conf;
        proxy_intercept_errors off;
    }

    # Health check Docker / Nginx host.
    location = /up {
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy_params.conf;
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Pratinjau halaman error Blade (resources/views/errors).
    # ---------------------------------------------------------------------
    location /errors/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/_proxy_params.conf;

        proxy_intercept_errors on;
        error_page 500 502 503 504 = @static_503;
    }

    # ---------------------------------------------------------------------
    # Frontend React (SPA + aset statis).
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:80;
        include /etc/nginx/conf.d/_proxy_params.conf;

        # Frontend mati → halaman 503 statis.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @static_503;
    }

    # Cadangan terakhir: halaman 503 statis dari disk (tanpa backend).
    location @static_503 {
        internal;
        root /srv/backend-public;
        try_files /errors/503.html =503;
    }
}
