# ---------------------------------------------------------------------------
# Konfigurasi utama nginx DI DALAM container.
#
# Dipakai untuk menyembunyikan versi server, menghormati header
# X-Forwarded-For dari Nginx host, dan mendefinisikan variabel
# $connection_upgrade yang dipakai _proxy_params.conf.
# ---------------------------------------------------------------------------

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Map WebSocket (Connection header).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Informasi versi tidak dikirim di header Server pada error page.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
