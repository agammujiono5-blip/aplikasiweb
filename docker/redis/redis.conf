# ---------------------------------------------------------------------------
# Redis internal (Docker network only)
# ---------------------------------------------------------------------------

# Persistensi AOF: cache/session Laravel tetap ada saat container restart.
appendonly yes
appendfsync everysec
dir /data

# Batas memori cache. allkeys-lru aman karena token Sanctum tidak disimpan
# di Redis (lihat App\Models\PersonalAccessToken::findToken).
maxmemory 256mb
maxmemory-policy allkeys-lru

# Nonaktifkan perintah berbahaya bila Redis tidak sengaja tersentuh.
# Laravel hanya memakai GET/SET/DEL/INCR/EXPIRE/SCAN.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command KEYS ""

# Port hanya mendengarkan di network internal container.
bind 0.0.0.0
protected-mode yes
port 6379
