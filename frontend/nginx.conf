# ---------------------------------------------------------------------------
# Frontend SPA (React 19 + Vite)
#
# File ini dipakai oleh container frontend, yang HANYA menerima trafik dari
# Nginx host (127.0.0.1:8080) atau dari nginx internal. SSL termination,
# security header publik dan /api proxy diatur di Nginx host
# (deploy/nginx/app.webisdepinjam.conf).
# ---------------------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Request non-GET/HEAD (mis. /api yang salah diarahkan ke frontend)
    # dijawab 405, bukan index.html → menghindari MIME type error JSON.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # SPA: semua route yang bukan berkas nyata dikembalikan ke index.html
    # supaya React Router / history API bekerja saat refresh langsung.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset hasil build punya hash di nama file → aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Berkas statis publik (favicon, manifest, gambar).
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|map)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache agar deployment baru langsung terpakai.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Health check container.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
